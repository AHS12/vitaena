name: Font Packs

# Publishes the fonts for Chinese, Japanese and Korean, which the app downloads when
# someone writes in them, on the release backend/fontpacks/packs.json names.
#
# It's a pre-release and never the latest, so the update check and the website, which
# ask GitHub for the latest release, never take it for a new version of the app. Run it
# once for each new "release" in packs.json, after the app that names it is released.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: Install the font packages
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Refuses any font that isn't the file packs.json lists.
      - name: Make the packs
        run: go run ./tools/fontpacks -out font-packs

      - name: Publish them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(jq -r .release backend/fontpacks/packs.json)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" font-packs/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" font-packs/*.zip --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Fonts for Chinese, Japanese and Korean ($TAG)" \
              --notes "Vitaena downloads these by itself when you write in Chinese, Japanese or Korean. You don't need to download them here."
          fi
