# The .deb, .rpm and Arch package, made by `wails3 tool package` (nfpm, built in).
# Name, version and description are kept in step with appconfig/app.config.json by
# `make version` and `make rename`. https://nfpm.goreleaser.com

name: "vitaena"
arch: "amd64"
platform: "linux"
version: "0.2.3"
release: "1"
section: "office"
priority: "optional"
maintainer: "AHS12 <AHS12@users.noreply.github.com>"
description: "Make a CV or resume that screening systems read correctly."
vendor: "AHS12"
homepage: "https://github.com/AHS12/vitaena"
license: "MIT"

contents:
  - src: "./bin/vitaena"
    dst: "/usr/bin/vitaena"
    file_info:
      mode: 0755
  - src: "./build/linux/app.desktop"
    dst: "/usr/share/applications/com.ahs12.vitaena.desktop"
  - src: "./build/linux/icons/hicolor"
    dst: "/usr/share/icons/hicolor"
    type: tree
  - src: "./LICENSE.md"
    dst: "/usr/share/licenses/vitaena/LICENSE.md"

# GTK 4 and WebKitGTK 6.0, which Wails 3.1 runs on: Ubuntu 24.04+, Debian 13+.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  # Fedora 40+, RHEL, Alma and Rocky 10.
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/postinstall.sh"
  postremove: "./build/linux/nfpm/postinstall.sh"
