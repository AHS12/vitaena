services:
  vitaena-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ahs12/vitaena:latest
    container_name: vitaena-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - vitaena_network
    volumes:
      # Optional: Mount volume for persistent data if needed
      - vitaena_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "http.get('http://localhost:3000', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (adjust based on your server capacity)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

networks:
  vitaena_network:
    driver: bridge

volumes:
  vitaena_data:
    driver: local
