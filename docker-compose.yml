services:
  vitaena-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ahs12/vitaena:latest
    container_name: vitaena-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - PUPPETEER_ARGS=--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-accelerated-2d-canvas --no-first-run --no-zygote --disable-gpu
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - vitaena_network
    volumes:
      # Optional: Mount volume for persistent data if needed
      - vitaena_data:/app/data
    # Shared memory for Puppeteer (critical for browser stability)
    shm_size: 4gb
    ipc: host
    # Temporary filesystems for cache and temp files
    tmpfs:
      - /tmp:exec,size=2g
      - /var/tmp:size=1g
      - /home/nextjs/.cache:size=1g
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "http.get('http://localhost:3000', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  vitaena_network:
    driver: bridge

volumes:
  vitaena_data:
    driver: local
