services:
  vitaena-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: vitaena-dev:latest
    container_name: vitaena-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9229:9229" # Node.js debugging port
    env_file:
      - .env
    environment:
      # Override NODE_ENV for development
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED}
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=${PUPPETEER_SKIP_CHROMIUM_DOWNLOAD}
      - PUPPETEER_EXECUTABLE_PATH=${PUPPETEER_EXECUTABLE_PATH}
      - PUPPETEER_ARGS=${PUPPETEER_ARGS}
      - PORT=${PORT}
      - HOSTNAME=${HOSTNAME}
    networks:
      - vitaena_dev_network
    volumes:
      # Mount the entire project directory for hot reload with consistent delegated mode
      - ./:/app:delegated
      # Exclude node_modules from the host to use container's node_modules
      - /app/node_modules
      # Exclude .next to prevent conflicts between host and container
      - /app/.next
      # Optional: Mount volume for persistent data if needed
      - vitaena_dev_data:/app/data
    # Shared memory for Puppeteer (critical for browser stability)
    shm_size: ${DOCKER_SHM_SIZE}
    ipc: host
    stdin_open: true
    tty: true
    # Temporary filesystems for cache and temp files
    tmpfs:
      - ${DOCKER_TMPFS_TMP}
      - ${DOCKER_TMPFS_VAR_TMP}
      - ${DOCKER_TMPFS_CACHE}
    # Use our Docker-specific development script with file polling for hot reload
    # Using the script defined in package.json
    command: sh -c "pnpm run dev:docker"
    # To Enable PWA for development with hot reload:
    # command: sh -c "pnpm run dev:docker:pwa"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "http.get('http://localhost:3000', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  vitaena_dev_network:
    driver: bridge

volumes:
  vitaena_dev_data:
    driver: local
