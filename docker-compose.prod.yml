version: "3.8"

services:
  vitaena-app:
    image: ahs12/vitaena:latest
    container_name: vitaena-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - caddy_web
    volumes:
      # Optional: Mount volume for persistent data if needed
      - vitaena_data:/app/data
      - vitaena_logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Security options
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem for security
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    # Additional security
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

networks:
  caddy_web:
    external: true

volumes:
  vitaena_data:
    driver: local
  vitaena_logs:
    driver: local
