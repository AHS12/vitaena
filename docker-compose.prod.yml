services:
  vitaena-app:
    image: ahs12/vitaena:latest
    container_name: vitaena-app
    restart: unless-stopped
    ports:
      - "3000:3000" # Map port for local testing
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED}
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=${PUPPETEER_SKIP_CHROMIUM_DOWNLOAD}
      - PUPPETEER_EXECUTABLE_PATH=${PUPPETEER_EXECUTABLE_PATH}
      - PUPPETEER_ARGS=${PUPPETEER_ARGS}
      - PORT=${PORT}
      - HOSTNAME=${HOSTNAME}
    networks:
      - caddy_web
    volumes:
      # Optional: Mount volume for persistent data if needed
      - vitaena_data:/app/data
      - vitaena_logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Security options - simplified for Puppeteer compatibility
    security_opt:
      - no-new-privileges:true
    # Shared memory for Puppeteer (critical for browser stability)
    shm_size: ${DOCKER_SHM_SIZE}
    ipc: host
    # Temporary filesystems for cache and temp files
    tmpfs:
      - ${DOCKER_TMPFS_TMP}
      - ${DOCKER_TMPFS_VAR_TMP}
      - ${DOCKER_TMPFS_CACHE}

networks:
  caddy_web:
    external: true

volumes:
  vitaena_data:
    driver: local
  vitaena_logs:
    driver: local
